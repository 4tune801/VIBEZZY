  <!-- Generate 512x512 & 192x192 PNG App Logo + PWA Manifest + Service Worker -->
  <script>
    (function setupVibezzyAppIconAndPWA() {
      function drawLogoPng(size) {
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");

        // Black rounded-square app icon background
        const r = size * 0.22;
        ctx.fillStyle = "#060807";
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.lineTo(size - r, 0);
        ctx.quadraticCurveTo(size, 0, size, r);
        ctx.lineTo(size, size - r);
        ctx.quadraticCurveTo(size, size, size - r, size);
        ctx.lineTo(r, size);
        ctx.quadraticCurveTo(0, size, 0, size - r);
        ctx.lineTo(0, r);
        ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.closePath();
        ctx.fill();

        // Subtle radial neon glow
        const grad = ctx.createRadialGradient(size * 0.5, size * 0.45, size * 0.05, size * 0.5, size * 0.5, size * 0.55);
        grad.addColorStop(0, "rgba(0, 255, 136, 0.35)");
        grad.addColorStop(1, "rgba(0, 255, 136, 0)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);

        // Neon border ring
        ctx.strokeStyle = "#00FF88";
        ctx.lineWidth = size * 0.03;
        ctx.beginPath();
        ctx.arc(size * 0.5, size * 0.5, size * 0.39, 0, Math.PI * 2);
        ctx.stroke();

        // Bold "V" Vibe Emblem
        ctx.strokeStyle = "#00FF88";
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = size * 0.11;
        ctx.beginPath();
        ctx.moveTo(size * 0.29, size * 0.32);
        ctx.lineTo(size * 0.50, size * 0.72);
        ctx.lineTo(size * 0.71, size * 0.32);
        ctx.stroke();

        // White audio pulse dot inside V
        ctx.fillStyle = "#FFFFFF";
        ctx.beginPath();
        ctx.arc(size * 0.50, size * 0.32, size * 0.055, 0, Math.PI * 2);
        ctx.fill();

        return canvas.toDataURL("image/png");
      }

      try {
        const icon512 = drawLogoPng(512);
        const icon192 = drawLogoPng(192);
        const icon180 = drawLogoPng(180);

        document.getElementById("favicon-link").href = icon192;
        document.getElementById("apple-icon-link").href = icon180;
        window.VIBEZZY_ICON_URL = icon192;

        const manifest = {
          name: "VIBEZZY",
          short_name: "VIBEZZY",
          description: "Your vibe. Your people. Your AIM.",
          start_url: window.location.href,
          display: "standalone",
          orientation: "portrait",
          background_color: "#000000",
          theme_color: "#00FF88",
          icons: [
            { src: icon192, sizes: "192x192", type: "image/png", purpose: "any maskable" },
            { src: icon512, sizes: "512x512", type: "image/png", purpose: "any maskable" },
          ],
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
        document.getElementById("manifest-link").href = URL.createObjectURL(manifestBlob);

        // Register inline Service Worker when on https:// or localhost
        if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
          const swCode = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('activate', e => self.clients.claim());
            self.addEventListener('fetch', e => {});
          `;
          const swBlob = new Blob([swCode], { type: "application/javascript" });
          navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        }
      } catch (e) {}
    })();
  </script>

      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [installHelpOpen, setInstallHelpOpen] = useState(false);

      useEffect(() => {
        const handler = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener("beforeinstallprompt", handler);
        return () => window.removeEventListener("beforeinstallprompt", handler);
      }, []);

      const handleInstallClick = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          setDeferredPrompt(null);
        } else {
          setInstallHelpOpen(true);
        }
      };

      // Core App State
      const [stories, setStories] = useState(INITIAL_STORIES);
      const [posts, setPosts] = useState(INITIAL_POSTS);
      const [rooms] = useState(LIVE_ROOMS);
      const [selectedRoomId, setSelectedRoomId] = useState(null);
      const [activeLiveRoomId, setActiveLiveRoomId] = useState("party_turner");
      const [liveChats, setLiveChats] = useState(() =>
        Object.fromEntries(LIVE_ROOMS.map((r) => [r.id, r.initialChat]))
      );
      const [tournaments, setTournaments] = useState(INITIAL_TOURNAMENTS);
      const [gameChat, setGameChat] = useState([
        { id: "gc1", handle: "@femi_playz", avatar: "🎮", text: "CODM Cup lobby opens in 20 mins!" },
        { id: "gc2", handle: "@ibrahim_k", avatar: "⚽", text: "Who's ready for EA FC qualifiers?" },
      ]);

      const [chats, setChats] = useState(INITIAL_CHATS);
      const [activeChatId, setActiveChatId] = useState(null);
      const [squads, setSquads] = useState(INITIAL_SQUADS);
      const [activeSquadId, setActiveSquadId] = useState(null);

      const [aimBalance, setAimBalance] = useState(1241);
      const [paymentMethod, setPaymentMethod] = useState("Opay");
      const [paystackPkg, setPaystackPkg] = useState(null);
      const [transactions, setTransactions] = useState(INITIAL_TRANSACTIONS);
      const [withdrawOpen, setWithdrawOpen] = useState(false);
      const [topUpForm, setTopUpForm] = useState({
        fullName: "", bankName: "", accountNumber: "", accountName: "", phoneNumber: "", email: "",
      });

      const [profile, setProfile] = useState({
        name: "Vibezzy Official", handle: "@vibezzzy", bio: "Creating vibes, Tech, Music",
        followers: 12400, following: 980, views: "1.2M", isFollowing: false,
      });
      const [profileVideos, setProfileVideos] = useState(PROFILE_VIDEOS);
      const [editProfileOpen, setEditProfileOpen] = useState(false);

      const [searchOpen, setSearchOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [notificationsOpen, setNotificationsOpen] = useState(false);
      const [notifications, setNotifications] = useState(INITIAL_NOTIFICATIONS);
      const [createPostOpen, setCreatePostOpen] = useState(false);
      const [activeStory, setActiveStory] = useState(null);
      const [activeVideo, setActiveVideo] = useState(null);
      const [commentsPostId, setCommentsPostId] = useState(null);
      const [giftBanner, setGiftBanner] = useState(null);
      const [handRaised, setHandRaised] = useState(false);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast((prev) => (prev === msg ? null : prev)), 2600);
      };

      const unreadNotifs = notifications.filter((n) => n.unread).length;
      const unreadChats = chats.reduce((acc, c) => acc + c.unread, 0);

      const activeRoom = rooms.find((r) => r.id === selectedRoomId);
      const activeChat = chats.find((c) => c.id === activeChatId);
      const activeSquad = squads.find((s) => s.id === activeSquadId);

      const handleToggleLikePost = (postId) => {
        setPosts((prev) =>
          prev.map((p) => (p.id === postId ? { ...p, liked: !p.liked, likes: p.liked ? p.likes - 1 : p.likes + 1 } : p))
        );
      };

      const handleAddComment = (postId, text) => {
        if (!text.trim()) return;
        setPosts((prev) =>
          prev.map((p) =>
            p.id === postId
              ? { ...p, comments: [...p.comments, { id: `c_${Date.now()}`, handle: profile.handle, avatar: "💚", text: text.trim() }] }
              : p
          )
        );
        showToast("Comment posted!");
      };

      const handleCreatePost = ({ roomId, caption, mediaType, previewUrl }) => {
        const room = rooms.find((r) => r.id === roomId) || rooms[0];
        const newPost = {
          id: `p_${Date.now()}`, roomId: room.id, roomName: room.name,
          authorName: profile.name, authorHandle: profile.handle, authorAvatar: "💚", verified: true,
          mediaType, durationSec: mediaType === "video" ? 30 : 0,
          caption: caption.trim(), previewUrl: previewUrl || null,
          gradient: "from-emerald-950 via-zinc-900 to-black",
          views: 1, likes: 0, liked: false, timeAgo: "Just now", comments: [],
        };
        setPosts((prev) => [newPost, ...prev]);
        setCreatePostOpen(false);
        setActiveTab("Home");
        setSelectedRoomId(null);
        showToast(`Posted to ${room.name}!`);
      };

      const handleSendGift = (gift) => {
        if (aimBalance < gift.cost) {
          showToast(`Need ${gift.cost} AIM for ${gift.name}. Top up Wallet!`);
          setActiveTab("Wallet");
          return;
        }
        const room = rooms.find((r) => r.id === activeLiveRoomId) || rooms[0];
        setAimBalance((b) => b - gift.cost);
        setLiveChats((prev) => ({
          ...prev,
          [room.id]: [
            ...(prev[room.id] || []),
            { id: `g_${Date.now()}`, handle: profile.handle, avatar: gift.emoji, text: `sent ${gift.name} (${gift.cost} AIM) to ${room.host.handle}!`, isGift: true },
          ],
        }));
        setTransactions((prev) => [
          { id: `tx_${Date.now()}`, title: `Sent ${gift.name} to ${room.host.handle}`, subtitle: `${room.name} Live`, amount: gift.cost, credit: false, time: "Just now", emoji: gift.emoji },
          ...prev,
        ]);
        setGiftBanner(`You sent ${gift.name}! ${gift.emoji}`);
        setTimeout(() => setGiftBanner(null), 2400);
      };

      const handleConfirmPaystack = (pkg) => {
        setAimBalance((b) => b + pkg.ami);
        setTransactions((prev) => [
          { id: `tx_${Date.now()}`, title: `Paystack ${paymentMethod} Top-Up`, subtitle: `+${pkg.ami} AIM • $${pkg.usd} (₦${pkg.ngn.toLocaleString()})`, amount: pkg.ami, credit: true, time: "Just now", emoji: "💚" },
          ...prev,
        ]);
        setPaystackPkg(null);
        showToast(`+${pkg.ami} AIM added via Paystack ${paymentMethod}!`);
      };

      return (
        <div className="min-h-screen bg-black text-white flex justify-center">
          <div className="w-full max-w-md min-h-screen bg-black border-x border-zinc-900 flex flex-col relative pb-20">

            {/* Global Header */}
            {!activeRoom && !activeChat && !activeSquad && (
              <header className="sticky top-0 z-30 bg-black/95 backdrop-blur-md border-b border-zinc-900 px-4 py-3 flex items-center justify-between">
                <button
                  onClick={() => { setActiveTab("Home"); setSelectedRoomId(null); }}
                  className="flex items-center gap-2 text-left"
                >
                  {window.VIBEZZY_ICON_URL && (
                    <img src={window.VIBEZZY_ICON_URL} alt="VIBEZZY Logo" className="w-8 h-8 rounded-xl border border-[#00FF88]/50" />
                  )}
                  <div>
                    <div className="text-lg font-black tracking-tight leading-none">
                      VIBE<span className="text-[#00FF88]">ZZY</span>
                    </div>
                    <p className="text-[9px] font-bold text-zinc-400">Your vibe. Your people. Your AIM.</p>
                  </div>
                </button>

                <div className="flex items-center gap-1.5">
                  <button
                    onClick={handleInstallClick}
                    className="px-2.5 py-1.5 rounded-full bg-zinc-900 border border-[#00FF88]/50 text-[#00FF88] text-[10px] font-black"
                    title="Install VIBEZZY to Home Screen"
                  >
                    📲 App
                  </button>
                  <button
                    onClick={() => setCreatePostOpen(true)}
                    className="w-8 h-8 rounded-full bg-[#00FF88] text-black font-black text-base flex items-center justify-center"
                    title="Create Post"
                  >
                    ＋
                  </button>
                  <button
                    onClick={() => setSearchOpen(true)}
                    className="w-8 h-8 rounded-full bg-[#1A1A1D] border border-zinc-800 text-sm flex items-center justify-center"
                    title="Search"
                  >
                    🔍
                  </button>
                  <button
                    onClick={() => setNotificationsOpen(true)}
                    className="relative w-8 h-8 rounded-full bg-[#1A1A1D] border border-zinc-800 text-sm flex items-center justify-center"
                    title="Notifications"
                  >
                    🔔
                    {unreadNotifs > 0 && (
                      <span className="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-[#00FF88] text-black text-[9px] font-black flex items-center justify-center">
                        {unreadNotifs}
                      </span>
                    )}
                  </button>
                </div>
              </header>
            )}

            {/* Main Content */}
            <main className="flex-1">
              {activeRoom ? (
                <RoomDetailView
                  room={activeRoom}
                  posts={posts.filter((p) => p.roomId === activeRoom.id)}
                  tournaments={tournaments}
                  gameChat={gameChat}
                  onBack={() => setSelectedRoomId(null)}
                  onLike={handleToggleLikePost}
                  onComment={(id) => setCommentsPostId(id)}
                  onShare={(p) => showToast(`Shared ${p.authorHandle}'s vibe!`)}
                  onJoinLiveAudio={() => { setActiveLiveRoomId(activeRoom.id); setSelectedRoomId(null); setActiveTab("Live"); }}
                  onSendGameChat={(txt) => {
                    if (!txt.trim()) return;
                    setGameChat((prev) => [...prev, { id: `gc_${Date.now()}`, handle: profile.handle, avatar: "💚", text: txt.trim() }]);
                  }}
                  onToggleTournament={(tid) => {
                    setTournaments((prev) => prev.map((t) => t.id === tid ? { ...t, joined: !t.joined, players: t.joined ? t.players - 1 : t.players + 1 } : t));
                    showToast("Tournament status updated!");
                  }}
                />
              ) : activeChat ? (
                <DirectChatView
                  chat={activeChat}
                  onBack={() => setActiveChatId(null)}
                  onSend={(txt) => {
                    if (!txt.trim()) return;
                    setChats((prev) => prev.map((c) => c.id === activeChat.id ? { ...c, time: "Now", messages: [...c.messages, { id: `m_${Date.now()}`, fromMe: true, text: txt.trim(), time: "Now" }] } : c));
                  }}
                />
              ) : activeSquad ? (
                <SquadChatView
                  squad={activeSquad}
                  onBack={() => setActiveSquadId(null)}
                  onSend={(txt) => {
                    if (!txt.trim()) return;
                    setSquads((prev) => prev.map((s) => s.id === activeSquad.id ? { ...s, messages: [...s.messages, { id: `sm_${Date.now()}`, handle: profile.handle, avatar: "💚", text: txt.trim(), time: "Now", isMe: true }] } : s));
                  }}
                />
              ) : (
                <>
                  {activeTab === "Home" && (
                    <div className="p-4 space-y-5">
                      <button
                        onClick={() => { setActiveLiveRoomId("party_turner"); setActiveTab("Live"); }}
                        className="w-full text-left rounded-2xl p-4 bg-gradient-to-r from-[#0B3522] via-[#121614] to-[#1A1A1D] border border-[#00FF88]/40"
                      >
                        <div className="flex items-center justify-between">
                          <span className="px-2.5 py-0.5 rounded-full bg-rose-600 text-white text-[10px] font-black">● 7 ROOMS LIVE NOW</span>
                          <span className="text-xs font-black text-[#00FF88]">Listen Live →</span>
                        </div>
                        <h2 className="text-base font-black mt-2">PARTY TURNER • 2.4k listening 🎉</h2>
                        <p className="text-xs text-zinc-300 mt-0.5">Hosted by @tunde_vibez with @emeka_plug & @kemi_spark</p>
                      </button>

                      {/* 24h Stories */}
                      <section>
                        <h3 className="text-xs font-black uppercase text-zinc-400 mb-2">24h Vibes</h3>
                        <div className="flex gap-3 overflow-x-auto no-scrollbar pb-1">
                          {stories.map((s) => (
                            <button
                              key={s.id}
                              onClick={() => { setStories((p) => p.map((x) => x.id === s.id ? { ...x, viewed: true } : x)); setActiveStory(s); }}
                              className="shrink-0 w-16 flex flex-col items-center"
                            >
                              <div className={`p-[2.5px] rounded-full ${s.viewed ? "bg-zinc-700" : "bg-gradient-to-tr from-[#00FF88] to-cyan-400"}`}>
                                <div className="w-14 h-14 rounded-full bg-[#1A1A1D] border-2 border-black flex items-center justify-center text-2xl">{s.avatar}</div>
                              </div>
                              <span className="text-[10px] font-bold truncate w-full text-center mt-1">{s.handle}</span>
                            </button>
                          ))}
                        </div>
                      </section>

                      {/* 7 Live Rooms */}
                      <section>
                        <div className="flex items-center justify-between mb-2">
                          <h3 className="text-xs font-black uppercase text-zinc-400">Live Vibe Rooms (7)</h3>
                          <span className="text-[11px] font-bold text-[#00FF88]">All active</span>
                        </div>
                        <div className="flex gap-3 overflow-x-auto no-scrollbar pb-1">
                          {rooms.map((r) => (
                            <button
                              key={r.id}
                              onClick={() => setSelectedRoomId(r.id)}
                              className="shrink-0 w-40 text-left rounded-2xl p-3 bg-[#1A1A1D] border border-zinc-800 hover:border-[#00FF88]"
                            >
                              <div className="flex items-center justify-between">
                                <span className="text-2xl">{r.emoji}</span>
                                <span className="text-[10px] font-black px-2 py-0.5 rounded-full bg-[#00FF88]/15 text-[#00FF88]">● {r.display}</span>
                              </div>
                              <p className="text-sm font-black mt-2 truncate">{r.name}</p>
                              <p className="text-[11px] text-zinc-400 line-clamp-2 mt-0.5">{r.topic}</p>
                            </button>
                          ))}
                        </div>
                      </section>

                      {/* Feed */}
                      <section className="space-y-4">
                        <h3 className="text-xs font-black uppercase text-zinc-400">Trending Feed</h3>
                        {posts.map((post) => (
                          <PostCard
                            key={post.id}
                            post={post}
                            onLike={() => handleToggleLikePost(post.id)}
                            onComment={() => setCommentsPostId(post.id)}
                            onShare={() => showToast(`Shared ${post.authorHandle}'s vibe!`)}
                            onOpenRoom={() => setSelectedRoomId(post.roomId)}
                          />
                        ))}
                      </section>
                    </div>
                  )}

                  {activeTab === "Live" && (
                    <LiveAudioView
                      rooms={rooms}
                      activeRoomId={activeLiveRoomId}
                      onSelectRoom={setActiveLiveRoomId}
                      chatMessages={liveChats[activeLiveRoomId] || []}
                      onSendChat={(txt) => {
                        if (!txt.trim()) return;
                        setLiveChats((prev) => ({
                          ...prev,
                          [activeLiveRoomId]: [...(prev[activeLiveRoomId] || []), { id: `lc_${Date.now()}`, handle: profile.handle, avatar: "💚", text: txt.trim(), isGift: false }],
                        }));
                      }}
                      onSendGift={handleSendGift}
                      giftBanner={giftBanner}
                      handRaised={handRaised}
                      onToggleHand={() => { setHandRaised((h) => !h); showToast(!handRaised ? "Hand raised ✋" : "Hand lowered"); }}
                      followers={profile.followers}
                      onToggleTestFollowers={() => setProfile((p) => ({ ...p, followers: p.followers < 500 ? 12400 : 320 }))}
                      onAttemptHost={() => showToast(profile.followers < 500 ? "Need 500 followers to host" : "You're live on stage! 🎙️")}
                    />
                  )}

                  {activeTab === "Chat" && (
                    <ChatListView
                      chats={chats}
                      users={DEMO_USERS}
                      onOpenChat={(id) => { setChats((p) => p.map((c) => c.id === id ? { ...c, unread: 0 } : c)); setActiveChatId(id); }}
                      onStartUserChat={(u) => {
                        const ex = chats.find((c) => c.user.id === u.id);
                        if (ex) setActiveChatId(ex.id);
                        else {
                          const nc = { id: `dm_${Date.now()}`, user: u, unread: 0, time: "Now", messages: [] };
                          setChats((p) => [nc, ...p]);
                          setActiveChatId(nc.id);
                        }
                      }}
                    />
                  )}

                  {activeTab === "Squads" && (
                    <SquadsView
                      squads={squads}
                      onOpenSquad={setActiveSquadId}
                      onToggleJoin={(id) => {
                        setSquads((p) => p.map((s) => s.id === id ? { ...s, joined: !s.joined, members: s.joined ? s.members - 1 : s.members + 1 } : s));
                        showToast("Squad updated!");
                      }}
                      onCreateSquad={(sq) => {
                        setSquads((p) => [{ ...sq, id: `sq_${Date.now()}`, members: 1, joined: true, messages: [{ id: `sm_${Date.now()}`, handle: profile.handle, avatar: "💚", text: `Welcome to ${sq.name}!`, time: "Now", isMe: true }] }, ...p]);
                        showToast(`${sq.name} Squad created!`);
                      }}
                    />
                  )}

                  {activeTab === "Wallet" && (
                    <WalletView
                      balance={aimBalance}
                      paymentMethod={paymentMethod}
                      onSelectMethod={setPaymentMethod}
                      onBuyPackage={setPaystackPkg}
                      topUpForm={topUpForm}
                      onChangeForm={setTopUpForm}
                      onSubmitTopUp={(e) => {
                        e.preventDefault();
                        if (!topUpForm.fullName || !topUpForm.bankName || !topUpForm.accountNumber) {
                          showToast("Fill in Full Name, Bank Name & Account Number");
                          return;
                        }
                        setAimBalance((b) => b + 250);
                        setTransactions((p) => [{ id: `tx_${Date.now()}`, title: `Bank Top-Up (${topUpForm.bankName})`, subtitle: topUpForm.fullName, amount: 250, credit: true, time: "Just now", emoji: "🏦" }, ...p]);
                        setTopUpForm({ fullName: "", bankName: "", accountNumber: "", accountName: "", phoneNumber: "", email: "" });
                        showToast("+250 AIM credited!");
                      }}
                      onOpenWithdraw={() => setWithdrawOpen(true)}
                      onCopyWallet={() => {
                        if (navigator.clipboard) navigator.clipboard.writeText("VBZ-AIM-8842-1241").catch(() => {});
                        showToast("Wallet ID VBZ-AIM-8842-1241 copied!");
                      }}
                      onShareWallet={() => showToast("Shared @vibezzzy • VBZ-AIM-8842-1241")}
                      transactions={transactions}
                    />
                  )}

                  {activeTab === "Profile" && (
                    <ProfileView
                      profile={profile}
                      aimBalance={aimBalance}
                      videos={profileVideos}
                      onTopUp={() => setActiveTab("Wallet")}
                      onToggleFollow={() => setProfile((p) => ({ ...p, isFollowing: !p.isFollowing, followers: p.isFollowing ? p.followers - 1 : p.followers + 1 }))}
                      onEditProfile={() => setEditProfileOpen(true)}
                      onCycleFollowerTier={() => setProfile((p) => ({ ...p, followers: p.followers >= 5000 ? 3200 : 12400 }))}
                      onOpenVideo={setActiveVideo}
                    />
                  )}
                </>
              )}
            </main>

            {/* Bottom Navigation: Home, Live, Chat, Squads, Wallet, Profile */}
            {!activeRoom && !activeChat && !activeSquad && (
              <nav className="fixed bottom-0 w-full max-w-md z-30 bg-black/95 backdrop-blur-lg border-t border-zinc-900 px-1 py-2 grid grid-cols-6">
                {BOTTOM_TABS.map((t) => {
                  const active = activeTab === t.id;
                  return (
                    <button
                      key={t.id}
                      onClick={() => setActiveTab(t.id)}
                      className={`relative flex flex-col items-center justify-center gap-0.5 py-1 rounded-xl ${active ? "text-[#00FF88]" : "text-zinc-400"}`}
                    >
                      <span className="text-lg leading-none">{t.emoji}</span>
                      {t.id === "Live" && <span className="absolute top-0.5 right-4 w-2 h-2 rounded-full bg-rose-500 animate-ping" />}
                      {t.id === "Chat" && unreadChats > 0 && (
                        <span className="absolute top-0 right-3 px-1 min-w-[14px] h-[14px] rounded-full bg-[#00FF88] text-black text-[9px] font-black flex items-center justify-center">{unreadChats}</span>
                      )}
                      <span className="text-[10px] font-black">{t.label}</span>
                    </button>
                  );
                })}
              </nav>
            )}

            {toast && (
              <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 bg-[#00FF88] text-black px-4 py-2 rounded-full font-black text-xs shadow-lg whitespace-nowrap">
                {toast}
              </div>
            )}

            {/* INSTALL APP GUIDE MODAL */}
            {installHelpOpen && (
              <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
                <div className="w-full max-w-sm rounded-3xl bg-[#1A1A1D] border border-[#00FF88]/50 p-5 space-y-3 text-center">
                  {window.VIBEZZY_ICON_URL && (
                    <img src={window.VIBEZZY_ICON_URL} alt="VIBEZZY App Icon" className="w-20 h-20 rounded-2xl mx-auto border border-[#00FF88]" />
                  )}
                  <h3 className="text-base font-black">Install VIBEZZY App</h3>
                  <p className="text-xs text-zinc-300 text-left space-y-1">
                    <span className="block"><strong className="text-[#00FF88]">iPhone / iPad (Safari):</strong> Tap the <strong>Share (⬆️)</strong> button → <strong>Add to Home Screen</strong>.</span>
                    <span className="block pt-1"><strong className="text-[#00FF88]">Android (Chrome):</strong> Tap the <strong>⋮ Menu</strong> → <strong>Add to Home screen / Install app</strong>.</span>
                  </p>
                  <button onClick={() => setInstallHelpOpen(false)} className="w-full py-2.5 rounded-xl bg-[#00FF88] text-black font-black text-xs">
                    Got it!
                  </button>
                </div>
              </div>
            )}

            {/* OTHER MODALS */}
            {searchOpen && (
              <SearchModal
                query={searchQuery} onChangeQuery={setSearchQuery}
                users={DEMO_USERS} rooms={rooms} squads={squads}
                onClose={() => setSearchOpen(false)}
                onSelectRoom={(id) => { setSearchOpen(false); setActiveTab("Home"); setSelectedRoomId(id); }}
                onSelectSquad={(id) => { setSearchOpen(false); setActiveTab("Squads"); setActiveSquadId(id); }}
                onSelectUser={(u) => {
                  setSearchOpen(false); setActiveTab("Chat");
                  const f = chats.find((c) => c.user.id === u.id);
                  if (f) setActiveChatId(f.id);
                }}
              />
            )}

            {notificationsOpen && (
              <NotificationsModal
                notifications={notifications}
                onClose={() => setNotificationsOpen(false)}
                onMarkAll={() => setNotifications((p) => p.map((n) => ({ ...n, unread: false })))}
                onClickItem={(n) => {
                  setNotifications((p) => p.map((x) => x.id === n.id ? { ...x, unread: false } : x));
                  setNotificationsOpen(false);
                  setActiveTab(n.tab);
                }}
              />
            )}

            {createPostOpen && <CreatePostModal rooms={rooms} onClose={() => setCreatePostOpen(false)} onSubmit={handleCreatePost} />}

            {activeStory && (
              <StoryModal
                story={activeStory}
                onClose={() => setActiveStory(null)}
                onJumpRoom={(rid) => { setActiveStory(null); setActiveLiveRoomId(rid); setActiveTab("Live"); }}
                onReply={(txt) => { showToast(`Replied to ${activeStory.handle}: "${txt}"`); setActiveStory(null); }}
              />
            )}

            {activeVideo && (
              <VideoModal
                video={activeVideo}
                onClose={() => setActiveVideo(null)}
                onLike={() => {
                  setProfileVideos((p) => p.map((v) => v.id === activeVideo.id ? { ...v, likes: v.likes + 1 } : v));
                  setActiveVideo((v) => ({ ...v, likes: v.likes + 1 }));

            <input value={handle} onChange={(e) => setHandle(e.target.value)} className="w-full bg-black border border-zinc-700 rounded-xl px-3 py-2 text-xs" />
            <textarea rows={3} value={bio} onChange={(e) => setBio(e.target.value)} className="w-full bg-black border border-zinc-700 rounded-xl p-3 text-xs" />
            <button type="submit" className="w-full py-2.5 rounded-xl bg-[#00FF88] text-black text-xs font-black">Save Changes</button>
          </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
